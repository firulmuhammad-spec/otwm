<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OTW - Overtime Work Management</title>
    
    <!-- PWA configuration and mobile styles -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OTW" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-192.png" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#04060b] text-slate-100 overflow-x-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      try {
        const isDevEnv = window.location.hostname === 'localhost' || window.location.hostname.includes('run.app');
        if ('serviceWorker' in navigator) {
          if (isDevEnv) {
            // Unregister any active service worker during development/preview to prevent stale bundle caches
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (let registration of registrations) {
                registration.unregister().then((success) => {
                  if (success) console.log('Dev Service Worker unregistered successfully.');
                }).catch(() => {});
              }
            }).catch(() => {});
            // Clear caches as well to ensure latest scripts are loaded
            if (window.caches) {
              caches.keys().then((names) => {
                for (let name of names) {
                  caches.delete(name).catch(() => {});
                }
              }).catch(() => {});
            }
          } else {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered successfully:', reg.scope))
                .catch(err => console.error('Service Worker registration failed:', err));
            });
          }
        }
      } catch (e) {
        console.warn('PWA initialization skipped due to environment limits:', e);
      }
    </script>
  </body>
</html>
